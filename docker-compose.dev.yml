services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cipherfault
      POSTGRES_USER: cipherfault
      POSTGRES_PASSWORD: dev_only_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cipherfault -d cipherfault"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env.dev.example
    environment:
      CIPHERFAULT_REQUIRE_RECOGNIZER: "0"
    ports:
      - "8000:8000"
    volumes:
      - uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file: .env.dev.example
    environment:
      CIPHERFAULT_REQUIRE_RECOGNIZER: "1"
    volumes:
      - uploads:/uploads
    mem_limit: 4g
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
