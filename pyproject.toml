[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cipherfault"
version = "0.1.0"
description = "Crypto-usage evidence engine for compiled software"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.13"
dependencies = [
    "networkx",
    "pyghidra",
]

[project.optional-dependencies]
recognizer = [
    "pyelftools>=0.33",
    "tabulate",
    "torch",
    "torch-geometric",
    "scikit-learn",
]
dev = [
    "build>=1.3",
    "jsonschema>=4.23",
    "pytest>=9",
    "pyelftools>=0.33",
    "scikit-learn",
    "tabulate",
    "torch",
    "torch-geometric",
]

[project.scripts]
cipherfault = "cipherfault.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cipherfault = ["cbom/schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
