[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cipherfault"
version = "0.1.0"
description = "Crypto-usage evidence engine for compiled software"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "networkx",
    "pyghidra",
]

[project.optional-dependencies]
recognizer = [
    "torch",
    "torch-geometric",
    "scikit-learn",
]

[project.scripts]
cipherfault = "cipherfault.cli:main"

[tool.setuptools.packages.find]
where = ["src"]